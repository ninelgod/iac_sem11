name: Build & Deploy to ECS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-2.amazonaws.com
  ECS_CLUSTER: gestorpagosg2-prod-cluster

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check || true

      - name: Lint
        run: npm run lint || true

  # SONARQUBE — analisis de calidad y seguridad del codigo
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Levantar SonarQube + PostgreSQL
        working-directory: sonarqube
        run: docker compose up -d

      - name: Esperar a que SonarQube este operativo
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:9000/api/system/status | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 10
          done
          echo "SonarQube no respondio a tiempo" >&2
          exit 1

      - name: Generar token de analisis
        id: sonar-token
        run: |
          TOKEN=$(curl -s -u admin:admin -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            -d "name=ci-${{ github.run_id }}" | jq -r .token)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Ejecutar SonarScanner CLI
        run: |
          docker run --rm \
            -e SONAR_HOST_URL="http://localhost:9000" \
            -e SONAR_TOKEN="${{ steps.sonar-token.outputs.token }}" \
            -v "${{ github.workspace }}:/usr/src" \
            --network host \
            sonarsource/sonar-scanner-cli

      - name: Verificar Quality Gate
        run: |
          STATUS="NONE"
          for i in $(seq 1 18); do
            STATUS=$(curl -s -u admin:admin \
              "http://localhost:9000/api/qualitygates/project_status?projectKey=gestor-prestamos" \
              | jq -r .projectStatus.status)
            if [ "$STATUS" != "NONE" ]; then
              break
            fi
            echo "Esperando a que SonarQube termine de procesar el reporte..."
            sleep 5
          done
          echo "Quality Gate: $STATUS"
          if [ "$STATUS" != "OK" ]; then
            echo "El Quality Gate no aprobo el codigo" >&2
            exit 1
          fi

      - name: Apagar SonarQube
        if: always()
        working-directory: sonarqube
        run: docker compose down -v

  # CHECKOV — escaneo de seguridad de la IaC
  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: iac/
          framework: terraform
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif

  # TERRAFORM — valida y aplica cambios de infraestructura en cada push a main
  terraform:
    name: Terraform Apply
    needs: [checkov]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init
        working-directory: iac/
        run: terraform init

      - name: Terraform Validate
        working-directory: iac/
        run: terraform validate

      - name: Terraform Plan
        working-directory: iac/
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: iac/
        run: terraform apply -auto-approve tfplan

  # BUILD & PUSH — solo en push a main (no en PRs)
  build-and-push:
    name: Build & Push to ECR
    needs: [test, sonarqube, checkov]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        service: [usuarios, pagos, reportes]

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: meta
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: prod-${{ github.sha }}-${{ github.run_attempt }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/gestorpagosg2-prod-${SERVICE}:${IMAGE_TAG}"
          LATEST_URI="${ECR_REGISTRY}/gestorpagosg2-prod-${SERVICE}:latest"
          docker build \
            --file services/${SERVICE}/Dockerfile \
            --tag "${IMAGE_URI}" \
            --tag "${LATEST_URI}" \
            --label "git-sha=${{ github.sha }}" \
            --label "service=${SERVICE}" \
            .
          docker push "${IMAGE_URI}"
          docker push "${LATEST_URI}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

  # DEPLOY — actualiza la task definition y fuerza nuevo deployment en ECS
  deploy:
    name: Deploy to ECS
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        service: [usuarios, pagos, reportes]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get current task definition
        id: get-taskdef
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "gestorpagosg2-prod-${SERVICE}" \
            --query taskDefinition \
            > task-def.json

      - name: Update container image in task definition
        id: update-taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ matrix.service }}
          # Usa el tag que build-and-push realmente pusheo (incluye run_attempt) en vez de recalcularlo
          # aparte - si no, este job intentaria desplegar un tag que nunca se subio a ECR.
          image: ${{ env.ECR_REGISTRY }}/gestorpagosg2-prod-${{ matrix.service }}:${{ needs.build-and-push.outputs.image-tag }}

      - name: Deploy updated task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.update-taskdef.outputs.task-definition }}
          service: gestorpagosg2-prod-${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          codedeploy-appspec: false

  # DEPLOY FRONTEND — sube archivos estáticos a S3 e invalida CloudFront
  deploy-frontend:
    name: Deploy Frontend to S3
    needs: [test, sonarqube, checkov]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 sync . s3://gestorpagosg2-prod-web/ \
            --exclude "*" \
            --include "index.html" \
            --delete \
            --region ${{ env.AWS_REGION }}

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1CL9KCGY67CPM \
            --paths "/*"

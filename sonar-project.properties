# Identificador del proyecto (debe coincidir con el Project key creado en SonarQube)
sonar.projectKey=gestor-prestamos
sonar.projectName=Gestor de Prestamos
sonar.projectVersion=1.0

# Donde esta el codigo fuente (relativo a este archivo)
sonar.sources=app,components,hooks,lib

# Carpetas que no deben analizarse
sonar.exclusions=**/node_modules/**,**/.next/**,**/public/**

# Codificacion de los archivos
sonar.sourceEncoding=UTF-8

# URL del servidor SonarQube (se sobreescribe via -Dsonar.host.url en CI)
sonar.host.url=http://localhost:9000
